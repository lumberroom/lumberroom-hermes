name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The suite imports Hermes's own MemoryProvider, MemoryManager and loader. Hermes refuses a
      # wheel build, so it installs editable from a pinned commit, the one the plugin is built against.
      - name: Hermes Agent at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout fdec926e
          python -m pip install -e "$RUNNER_TEMP/hermes-agent[mcp]"
      - name: Plugin dependencies
        run: python -m pip install "mcp>=2.0.0,<3" "httpx2>=2.7.0,<3" "filelock>=3.12,<4" "pytest==9.1.1" "pytest-asyncio==1.3.0"
      - run: python -m pytest -q
      - name: Hermes catalog validation
        run: |
          mkdir "$RUNNER_TEMP/clean" && git archive HEAD | tar -x -C "$RUNNER_TEMP/clean"
          HERMES_HOME="$RUNNER_TEMP/hermes-home" hermes plugins validate "$RUNNER_TEMP/clean"
